name: Bug 反馈
description: 报告软件中的异常或样式问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: 软件版本
      description: 可在「设置 → 关于」中点击「复制版本信息」查看
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 简述遇到了什么问题，以及预期表现是什么
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开「计划内」视图
        2. 右键点击某条任务...
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 截图或补充信息（可选）
      description: 可直接粘贴截图或 WebDAV / 迁移报错日志（注意隐去密码和邮箱）
